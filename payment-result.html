<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portexa | Payment status</title><style>body{font-family:system-ui,sans-serif;background:#f6f7f4;color:#183e35;display:grid;place-items:center;min-height:100vh;margin:0;padding:20px}.card{max-width:560px;background:#fff;padding:28px;border-radius:18px;box-shadow:0 8px 30px #0001}a{color:#17483b}#status{overflow-wrap:anywhere}</style></head><body><main class="card"><h1>Portexa payment status</h1><p id="status">Verifying your payment securely with Paystack…</p><p><a href="/">Return to Portexa</a> · <a href="/account.html">View your account</a></p></main><script>
(async()=>{const el=document.getElementById('status');const reference=new URLSearchParams(location.search).get('reference');if(!reference){el.textContent='No payment reference was provided. If you completed a payment, contact Portexa with your Paystack receipt.';return;}try{const r=await fetch('/api/paystack/verify?reference='+encodeURIComponent(reference));const d=await r.json();if(r.ok&&d.success){try{localStorage.removeItem('portexa_cart')}catch(e){}el.textContent=Payment confirmed. Thank you! Your order is recorded. Order reference: '+reference;}else{el.textContent=(d.message||d.error||'We could not confirm this payment yet.')+' Payment reference: '+reference+'. Please do not pay again until you have checked your receipt or contacted Portexa.';}}catch(e){el.textContent='We could not verify the payment right now. Please contact Portexa with reference '+reference+'.';}})();
</script></body></html>
