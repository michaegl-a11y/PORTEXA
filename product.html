<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#075b4b">
  <title>Product Details | Portexa</title>
  <link rel="stylesheet" href="/assets/site.css">
</head>

<body>
  <div class="topline">
    Thoughtfully made everyday care · Delivery available across Nigeria
  </div>

  <script src="/assets/header.js" data-part="header"></script>

  <main class="page-wrap">
    <div id="product-detail" class="about-inner">
      <p>Loading product details…</p>
    </div>
  </main>

  <script src="/assets/header.js" data-part="footer"></script>

  <script src="/assets/cart.js"></script>

  <script>
    (function () {
      const box = document.getElementById('product-detail');
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');

      const products = window.PORTEXA_PRODUCTS || {};
      const product = id ? products[id] : null;

      document.querySelectorAll('[data-year]').forEach(function (el) {
        el.textContent = new Date().getFullYear();
      });

      if (!product) {
        box.innerHTML = '';

        const message = document.createElement('div');
        const heading = document.createElement('h1');
        const description = document.createElement('p');
        const link = document.createElement('a');

        heading.textContent = 'Product not found';
        description.textContent =
          'This product could not be loaded. Please return to the shop and select it again.';

        link.href = '/shop.html';
        link.className = 'button';
        link.textContent = 'Back to shop';

        message.append(heading, description, link);
        box.appendChild(message);
        return;
      }

      document.title = product.name + ' | Portexa';

      const visual = document.createElement('div');
      visual.className = 'product-visual';
      visual.style.cssText =
        'background:#f4f7f2;border-radius:20px;padding:16px;display:flex;align-items:center;justify-content:center;min-height:300px';

      const image = document.createElement('img');
      image.className = 'catalog-image';
      image.src = product.image;
      image.alt = product.alt;
      image.style.cssText =
        'width:100%;max-width:420px;max-height:420px;object-fit:contain';

      const imageFallback = document.createElement('p');
      imageFallback.textContent = product.name;
      imageFallback.style.display = 'none';

      image.onerror = function () {
        image.style.display = 'none';
        imageFallback.style.display = 'block';
      };

      visual.append(image, imageFallback);

      const details = document.createElement('div');

      const eyebrow = document.createElement('div');
      eyebrow.className = 'eyebrow';
      eyebrow.textContent = 'Portexa personal care';

      const heading = document.createElement('h1');
      heading.textContent = product.name;

      const description = document.createElement('p');
      description.textContent = product.detail;

      const price = document.createElement('h2');
      price.textContent = '₦' + product.price.toLocaleString('en-NG');

      const delivery = document.createElement('p');
      delivery.textContent =
        'Delivery charges will be confirmed before your order is finalised.';

      const actions = document.createElement('div');
      actions.className = 'page-actions';

      const addButton = document.createElement('button');
      addButton.type = 'button';
      addButton.className = 'button';
      addButton.textContent = 'Add to cart';

      addButton.addEventListener('click', function () {
        if (!window.portexaCart) {
          alert('The cart could not load. Please refresh and try again.');
          return;
        }

        window.portexaCart.add(product.id);
        window.location.href = '/cart.html';
      });

      const backLink = document.createElement('a');
      backLink.href = '/shop.html';
      backLink.className = 'button secondary';
      backLink.textContent = 'Back to shop';

      actions.append(addButton, backLink);
      details.append(eyebrow, heading, description, price, delivery, actions);

      box.innerHTML = '';
      box.append(visual, details);
    })();
  </script>

  <script src="/assets/chat.js"></script>
</body>
</html>
