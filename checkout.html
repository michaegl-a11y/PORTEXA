<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075b4b"><link rel="stylesheet" href="/assets/site.css"><title>Checkout | Portexa</title><meta name="description" content="Portexa everyday care products. Built on trust, delivered with excellence."></head><body><div class="topline">Thoughtfully made everyday care · Delivery available across Nigeria</div><script src="/assets/header.js" data-part="header"></script><main class="page-wrap"><div class="page-intro"><div class="eyebrow">Secure checkout</div><h1>Delivery details</h1><p>Enter your details to create your order and continue to Paystack. Never send card details to Portexa by email or WhatsApp.</p></div><div class="form-card"><div id="checkout-summary" class="cart-summary"></div><form id="checkout-form"><div class="form-grid"><div class="field"><label for="name">Full name</label><input id="name" name="name" required maxlength="160" autocomplete="name"></div><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="email"></div><div class="field"><label for="phone">Phone number</label><input id="phone" name="phone" required maxlength="40" autocomplete="tel"></div><div class="field full"><label for="address">Delivery address</label><textarea id="address" name="address" required maxlength="1000" autocomplete="street-address"></textarea></div><div class="field full"><label for="notes">Order notes (optional)</label><textarea id="notes" name="notes" maxlength="2000" rows="3"></textarea></div></div><p id="checkout-status" role="status" class="notice" style="display:none"></p><div class="page-actions"><button class="button" type="submit" id="pay-button">Continue to Paystack</button><a class="button secondary" href="/cart.html">Back to cart</a></div></form></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/cart.js"></script><script>
async function portexaToken(){try{const c=await(await fetch('/api/config',{cache:'no-store'})).json();if(!c.supabaseUrl||!c.supabaseAnonKey||!window.supabase)return'';const sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);const{data}=await sb.auth.getSession();return data&&data.session?data.session.access_token:''}catch(e){return''}}
const money=n=>'₦'+n.toLocaleString('en-NG');const cartNow=portexaCart.get(),ids=Object.keys(cartNow);const sum=ids.reduce((s,id)=>s+(PORTEXA_PRODUCTS[id]?PORTEXA_PRODUCTS[id].price*cartNow[id]:0),0);document.getElementById('checkout-summary').innerHTML=ids.length?ids.map(id=>PORTEXA_PRODUCTS[id]?PORTEXA_PRODUCTS[id].name+' × '+cartNow[id]+' — '+money(PORTEXA_PRODUCTS[id].price*cartNow[id]):'').join('<br>')+'<hr><strong>Subtotal: '+money(sum)+'</strong><p class="quote-note">Delivery is confirmed separately.</p>':'Your cart is empty. <a href="/shop.html">Browse products</a>';if(!ids.length)document.getElementById('pay-button').disabled=true;document.getElementById('checkout-form').addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('checkout-status'),btn=document.getElementById('pay-button');if(!portexaCart.count()){status.style.display='block';status.className='notice error';status.textContent='Your cart is empty.';return}btn.disabled=true;status.style.display='block';status.className='notice';status.textContent='Creating your order securely…';try{const token=await portexaToken();const r=await fetch('/api/paystack/initialize',{method:'POST',headers:token?{'Content-Type':'application/json',Authorization:'Bearer '+token}:{'Content-Type':'application/json'},body:JSON.stringify({customer:{name:document.getElementById('name').value,email:document.getElementById('email').value,phone:document.getElementById('phone').value,address:document.getElementById('address').value},notes:document.getElementById('notes').value,items:Object.keys(portexaCart.get()).map(id=>({id,quantity:portexaCart.get()[id]}))})});const d=await r.json();if(!r.ok||!d.authorizationUrl)throw Error(d.error||'Payment could not be started.');localStorage.setItem('portexa_last_order_id',d.orderId||'');location.href=d.authorizationUrl}catch(err){status.className='notice error';status.textContent=err.message||'Payment could not be started. Please try again.';btn.disabled=false}});</script><script src="/assets/header.js" data-part="footer"></script><script>document.querySelectorAll('[data-year]').forEach(e=>e.textContent=new Date().getFullYear());</script><script src="/assets/chat.js"></script>
