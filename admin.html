<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portexa | Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #f6f7f4;
      color: #183e35;
      margin: 0;
      padding: 20px;
    }

    .wrap {
      max-width: 1100px;
      margin: auto;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      padding: 22px;
      margin: 20px 0;
      box-shadow: 0 4px 20px #0000000b;
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    a {
      color: #17483b;
    }

    #login-card {
      max-width: 520px;
    }

    #login-form label {
      display: block;
      margin-bottom: 16px;
      font-weight: 600;
    }

    #login-form input {
      display: block;
      width: 100%;
      margin-top: 7px;
      padding: 13px;
      font: inherit;
      border: 1px solid #ccd6d0;
      border-radius: 8px;
    }

    button {
      font: inherit;
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #17483b;
      color: white;
      cursor: pointer;
      margin: 4px 4px 4px 0;
    }

    button:hover {
      background: #236653;
    }

    #login {
      width: 100%;
    }

    #dashboard-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    #dashboard-controls button {
      min-height: 44px;
    }

    #status {
      color: #66736c;
      overflow-wrap: anywhere;
    }

    #orders,
    #conversations,
    #thread-messages {
      min-width: 0;
    }

    .scroll {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 750px;
      border-collapse: collapse;
    }

    td, th {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #e3e8e4;
      vertical-align: top;
    }

    small {
      color: #66736c;
    }

    .chatrow {
      border-bottom: 1px solid #e3e8e4;
      padding: 14px 0;
      overflow-wrap: anywhere;
    }

    #thread {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid #e3e8e4;
    }

    #thread-messages {
      max-height: 400px;
      overflow-y: auto;
      padding: 8px 0;
    }

    #thread-messages p {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #reply-form {
      margin-top: 16px;
    }

    #reply-text {
      display: block;
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      resize: vertical;
      font: inherit;
      border: 1px solid #ccd6d0;
      border-radius: 8px;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px;
      }

      .card {
        padding: 16px;
      }

      h1 {
        font-size: 26px;
      }

      #dashboard-controls {
        align-items: stretch;
      }

      #dashboard-controls button {
        flex: 1 1 140px;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <a href="/">← Storefront</a>

    <h1>Portexa Admin Dashboard</h1>
    <p id="status">Sign in with your administrator account.</p>

    <section class="card" id="login-card">
      <h2>Admin login</h2>

      <form id="login-form">
        <label for="email">
          Email
          <input id="email" type="email" autocomplete="username" required>
        </label>

        <label for="password">
          Password
          <input id="password" type="password" autocomplete="current-password" required>
        </label>

        <button id="login" type="submit">Sign in</button>
      </form>
    </section>

    <section class="card">
      <h2>Dashboard controls</h2>
      <div id="dashboard-controls">
        <button id="logout" type="button">Sign out</button>
        <button id="refresh" type="button">Refresh data</button>
      </div>
    </section>

    <section class="card">
      <h2>Orders</h2>
      <div class="scroll" id="orders">Sign in to load orders.</div>
    </section>

    <section class="card">
      <h2>Support conversations</h2>
      <div id="conversations">Sign in to load conversations.</div>

      <div id="thread" style="display:none">
        <h3 id="thread-title">Conversation</h3>
        <div id="thread-messages"></div>

        <form id="reply-form">
          <textarea
            id="reply-text"
            required
            maxlength="4000"
            rows="3"
            placeholder="Write your reply..."
          ></textarea>
          <button type="submit">Send reply</button>
        </form>
      </div>
    </section>
  </div>

  <script>
    (async () => {
      const $ = id => document.getElementById(id);

      const status = $('status');

      let sb;
      let activeConversation = null;
      let activeToken = null;

      function escapeHTML(value) {
        return String(value ?? '').replace(/[&<>"']/g, character => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[character]);
      }

      try {
        const configResponse = await fetch('/api/config');
        const cfg = await configResponse.json();

        if (!configResponse.ok ||
            !cfg.supabaseUrl ||
            !cfg.supabaseAnonKey) {
          status.textContent = 'Supabase is not configured correctly.';
          return;
        }

        sb = window.supabase.createClient(
          cfg.supabaseUrl,
          cfg.supabaseAnonKey
        );
      } catch (error) {
        console.error('Configuration error:', error);
        status.textContent = 'Could not load configuration. Please refresh.';
        return;
      }

      async function session() {
        const { data, error } = await sb.auth.getSession();

        if (error) {
          console.error('Session error:', error.message);
          status.textContent = 'Session error: ' + error.message;
          return null;
        }

        return data.session;
      }

      async function refresh() {
        const s = await session();

        if (!s) {
          $('orders').textContent = 'Sign in to view orders.';
          $('conversations').textContent =
            'Sign in to view support conversations.';
          return;
        }

        status.textContent = 'Signed in. Loading dashboard data...';

        try {
          const response = await fetch('/api/admin/data', {
            headers: {
              Authorization: 'Bearer ' + s.access_token
            }
          });

          const data = await response.json();

          if (!response.ok) {
            status.textContent =
              'Could not load dashboard: ' +
              (data.error || 'Request failed (' + response.status + ').');

            $('orders').textContent = 'Orders could not be loaded.';
            $('conversations').textContent =
              'Support conversations could not be loaded.';
            return;
          }

          const orders = Array.isArray(data.orders) ? data.orders : [];
          const conversations = Array.isArray(data.conversations)
            ? data.conversations
            : [];

          status.textContent = 'Signed in. Admin data loaded.';

          if (orders.length === 0) {
            $('orders').textContent = 'No orders yet.';
          } else {
            $('orders').innerHTML = `
              <table>
                <thead>
                  <tr>
                    <th>Order</th>
                    <th>Customer</th>
                    <th>Items</th>
                    <th>Total</th>
                    <th>Payment</th>
                    <th>Order status</th>
                  </tr>
                </thead>
                <tbody>
                  ${orders.map(order => `
                    <tr>
                      <td>
                        ${escapeHTML(String(order.id || '').slice(0, 8))}
                        <br>
                        <small>${escapeHTML(
                          order.created_at
                            ? new Date(order.created_at).toLocaleString()
                            : ''
                        )}</small>
                      </td>

                      <td>
                        ${escapeHTML(order.customer_name)}
                        <br>${escapeHTML(order.customer_email)}
                        <br>${escapeHTML(order.customer_phone)}
                        <br>${escapeHTML(order.delivery_address)}
                      </td>

                      <td>
                        ${(Array.isArray(order.items) ? order.items : [])
                          .map(item =>
                            `${escapeHTML(item.name)} × ${escapeHTML(item.quantity)}`
                          )
                          .join('<br>')}
                      </td>

                      <td>
                        ₦${Number(order.subtotal || 0).toLocaleString('en-NG')}
                      </td>

                      <td>Payment details unavailable</td>

                      <td>${escapeHTML(order.status || 'Unknown')}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            `;
          }

          if (conversations.length === 0) {
            $('conversations').textContent = 'No conversations yet.';
            return;
          }

          $('conversations').innerHTML = conversations.map(conversation => `
            <div class="chatrow">
              <strong>${escapeHTML(conversation.name)}</strong>
              · ${escapeHTML(conversation.email)}
              <br>

              <small>
                ${escapeHTML(conversation.status)}
                ·
                ${escapeHTML(
                  conversation.updated_at || conversation.created_at
                    ? new Date(
                        conversation.updated_at || conversation.created_at
                      ).toLocaleString()
                    : ''
                )}
              </small>
              <br>

              <button
                type="button"
                data-id="${escapeHTML(conversation.id)}"
                data-token="${escapeHTML(conversation.visitor_token)}"
                data-name="${escapeHTML(conversation.name)}"
              >Open conversation</button>
            </div>
          `).join('');

          $('conversations').querySelectorAll('button[data-id]')
            .forEach(button => {
              button.addEventListener('click', () => {
                openThread(
                  button.dataset.id,
                  button.dataset.token,
                  button.dataset.name
                );
              });
            });

        } catch (error) {
          console.error('Dashboard loading error:', error);
          status.textContent =
            'Could not load dashboard data. Please refresh and try again.';
          $('orders').textContent = 'An error occurred loading orders.';
          $('conversations').textContent =
            'An error occurred loading conversations.';
        }
      }

      async function openThread(id, token, name) {
        activeConversation = id;
        activeToken = token;

        $('thread').style.display = 'block';
        $('thread-title').textContent = 'Conversation with ' + name;

        await loadThread();
      }

      async function loadThread() {
        if (!activeToken) return;

        try {
          const response = await fetch(
            '/api/chat?visitorToken=' + encodeURIComponent(activeToken)
          );

          const data = await response.json();

          if (!response.ok) {
            status.textContent =
              data.error || 'Could not load conversation messages.';
            return;
          }

          const messages = Array.isArray(data.messages)
            ? data.messages
            : [];

          $('thread-messages').innerHTML = messages.map(message => `
            <div class="chatrow">
              <strong>
                ${message.sender_role === 'admin' ? 'Portexa' : 'Customer'}
              </strong>
              ·
              <small>${escapeHTML(
                message.created_at
                  ? new Date(message.created_at).toLocaleString()
                  : ''
              )}</small>
              <p></p>
            </div>
          `).join('');

          const paragraphs =
            $('thread-messages').querySelectorAll('p');

          paragraphs.forEach((paragraph, index) => {
            paragraph.textContent = messages[index].message || '';
          });

        } catch (error) {
          console.error('Conversation loading error:', error);
          status.textContent = 'Could not load messages. Please try again.';
        }
      }

      $('login-form').addEventListener('submit', async event => {
        event.preventDefault();

        const button = $('login');
        button.disabled = true;
        button.textContent = 'Signing in...';

        try {
          const { error } = await sb.auth.signInWithPassword({
            email: $('email').value.trim(),
            password: $('password').value
          });

          if (error) {
            status.textContent = 'Login failed: ' + error.message;
            return;
          }

          await refresh();

        } catch (error) {
          console.error('Login error:', error);
          status.textContent = 'Login failed. Please try again.';
        } finally {
          button.disabled = false;
          button.textContent = 'Sign in';
        }
      });

      $('logout').addEventListener('click', async () => {
        const { error } = await sb.auth.signOut();

        if (error) {
          status.textContent = 'Could not sign out: ' + error.message;
          return;
        }

        activeConversation = null;
        activeToken = null;
        $('thread').style.display = 'none';
        status.textContent = 'Signed out.';
        await refresh();
      });

      $('refresh').addEventListener('click', refresh);

      $('reply-form').addEventListener('submit', async event => {
        event.preventDefault();

        const message = $('reply-text').value.trim();

        if (!message || !activeConversation) {
          status.textContent = 'Open a conversation before replying.';
          return;
        }

        const s = await session();

        if (!s) {
          status.textContent = 'Please sign in again.';
          return;
        }

        try {
          const response = await fetch('/api/admin/reply', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: 'Bearer ' + s.access_token
            },
            body: JSON.stringify({
              conversationId: activeConversation,
              message
            })
          });

          const data = await response.json();

          if (!response.ok) {
            status.textContent = data.error || 'Reply could not be sent.';
            return;
          }

          $('reply-text').value = '';
          await loadThread();
          status.textContent = 'Reply saved successfully.';

        } catch (error) {
          console.error('Reply error:', error);
          status.textContent = 'Could not send reply. Please try again.';
        }
      });

      await refresh();

      setInterval(() => {
        if (activeConversation) {
          loadThread().catch(console.error);
        }
      }, 15000);

    })();
  </script>
</body>
</html>
