<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#075b4b">
  <title>Portexa | Admin</title>
  <script>
    /* Safety net: never fail silently. Shows any page error in the status bar. */
    (function () {
      var started = false;
      window.__adminStarted = function () { started = true; };
      function show(message) {
        var el = document.getElementById('status');
        if (el) { el.textContent = message; el.className = 'err'; }
      }
      window.addEventListener('error', function (e) {
        show('Page error: ' + (e.message || 'unknown') + (e.lineno ? ' (line ' + e.lineno + ')' : '') + ' [admin v3.1]');
      });
      window.addEventListener('unhandledrejection', function (e) {
        show('Page error: ' + ((e.reason && e.reason.message) || e.reason || 'unknown') + ' [admin v3.1]');
      });
      setTimeout(function () {
        if (!started) show('The admin page could not start (the page file may be incomplete). Close this tab and reopen it, then tell Claude: "script did not start" [admin v3.1]');
      }, 6000);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --green: #075b4b;
      --green-dark: #064638;
      --ink: #173b35;
      --gold: #f2c500;
      --bg: #f3f6f2;
      --card: #ffffff;
      --line: #dce7e1;
      --muted: #687a75;
      --red: #b3261e;
      --red-bg: #fdecea;
      --amber: #8a5a00;
      --amber-bg: #fff4d6;
      --ok: #1c6b3a;
      --ok-bg: #e3f4e8;
      --blue: #1f5f99;
      --blue-bg: #e6f0fa;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
    }
    a { color: var(--green); }

    /* ---------- Top bar ---------- */
    .topbar { position: sticky; top: 0; z-index: 30; background: var(--green-dark); color: #f6f1e4; }
    .topbar-inner {
      max-width: 1000px; margin: 0 auto; padding: 13px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { font-size: 1.25rem; font-weight: 800; letter-spacing: .3px; color: #fff; text-decoration: none; }
    .brand span { color: var(--gold); font-weight: 500; margin-left: 6px; }
    .top-right { display: flex; align-items: center; gap: 14px; }
    .store-link { color: #f6f1e4; font-size: .9rem; opacity: .85; text-decoration: none; white-space: nowrap; }
    .store-link:hover { opacity: 1; text-decoration: underline; }
    @media (max-width: 360px) {
      .topbar-inner { padding: 12px 12px; gap: 8px; }
      .brand { font-size: 1.05rem; }
      .top-right { gap: 9px; }
      .store-link { font-size: .8rem; }
    }
    .menu-wrap { position: relative; }
    .menu-btn {
      width: 40px; height: 40px; min-height: 40px; padding: 0; border-radius: 50%;
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3);
      color: #fff; font-size: 1.3rem; line-height: 1; letter-spacing: 1px;
    }
    .menu-btn:hover, .menu-btn[aria-expanded="true"] { background: rgba(255,255,255,.24); }
    .menu {
      position: absolute; right: 0; top: 48px; min-width: 230px; z-index: 40;
      background: #fff; color: var(--ink); border: 1px solid var(--line);
      border-radius: 14px; box-shadow: 0 14px 34px #0000003d; padding: 6px;
    }
    .menu-who { padding: 8px 12px 10px; margin-bottom: 4px; border-bottom: 1px solid var(--line); font-size: .78rem; color: var(--muted); }
    .menu-who b { display: block; margin-top: 2px; color: var(--ink); font-size: .92rem; overflow-wrap: anywhere; }
    .menu button { width: 100%; text-align: left; background: transparent; color: var(--ink); border-radius: 10px; }
    .menu button:hover { background: var(--bg); }
    .menu button.danger { color: var(--red); }

    .wrap { max-width: 1000px; margin: 0 auto; padding: 14px 14px 60px; }

    /* ---------- Buttons and inputs ---------- */
    button {
      font: inherit; font-weight: 700; min-height: 44px; padding: 10px 16px;
      border: 0; border-radius: 12px; background: var(--green); color: #fff; cursor: pointer;
    }
    button:hover { background: var(--green-dark); }
    button:disabled { opacity: .55; cursor: default; }
    button.ghost { background: #fff; color: var(--green); border: 1px solid var(--line); }
    button.ghost:hover { background: var(--bg); }
    button.small { min-height: 38px; padding: 6px 12px; font-size: .88rem; }
    .full { width: 100%; }
    label { display: block; font-weight: 700; font-size: .9rem; margin-bottom: 14px; }
    input, textarea, select {
      display: block; width: 100%; margin-top: 6px; padding: 12px 13px;
      font: inherit; font-size: 16px; color: var(--ink);
      border: 1px solid #c9d8d0; border-radius: 12px; background: #fff;
    }
    input:focus, textarea:focus, select:focus, button:focus-visible, a:focus-visible {
      outline: 3px solid var(--gold); outline-offset: 1px;
    }

    /* ---------- Status line ---------- */
    .status-row { display: flex; gap: 8px; align-items: stretch; margin: 0 0 12px; }
    .icon-btn {
      flex: 0 0 44px; width: 44px; min-height: 44px; padding: 0; font-size: 1.25rem; line-height: 1;
      background: #fff; color: var(--green); border: 1px solid var(--line);
    }
    .icon-btn:hover { background: var(--bg); }
    .icon-btn .ico { display: inline-block; }
    .icon-btn.spin .ico { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status {
      flex: 1; margin: 0; padding: 9px 12px; display: flex; align-items: center; border-radius: 12px;
      font-size: .88rem; background: #fff; border: 1px solid var(--line);
      color: var(--muted); overflow-wrap: anywhere;
    }
    #status.ok { background: var(--ok-bg); border-color: #bfe3ca; color: var(--ok); }
    #status.err { background: var(--red-bg); border-color: #f3c3bf; color: var(--red); }
    .warning {
      margin: 0 0 12px; padding: 12px 14px; border-radius: 12px;
      background: var(--amber-bg); border: 1px solid #f0d58a; color: var(--amber); font-size: .9rem;
    }

    .card {
      background: var(--card); border-radius: 18px; padding: 18px;
      border: 1px solid var(--line); box-shadow: 0 2px 14px #0000000a;
    }

    /* ---------- Login ---------- */
    #login-view { max-width: 420px; margin: 20px auto 0; }
    #login-view h1 { font-size: 1.6rem; margin: 0 0 6px; }
    #login-view p { color: var(--muted); margin: 0 0 18px; }

    /* ---------- Summary cards ---------- */
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .stat {
      background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 14px;
      text-align: left; color: var(--ink); min-height: 0; font-weight: 400;
    }
    button.stat:hover { background: #fff; border-color: var(--green); }
    .stat b { display: block; font-size: 1.6rem; line-height: 1.15; }
    .stat small { color: var(--muted); font-size: .8rem; }
    .stat.alert { border-color: #f0b7b2; background: var(--red-bg); }
    .stat.alert b { color: var(--red); }
    @media (min-width: 700px) { .stats { grid-template-columns: repeat(4, 1fr); } }

    /* ---------- Tabs ---------- */
    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .tab { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .tab:hover { background: #fff; border-color: var(--green); }
    .tab.active { background: var(--green); color: #fff; border-color: var(--green); }
    .count {
      display: inline-block; min-width: 22px; padding: 1px 7px; margin-left: 6px;
      border-radius: 999px; background: var(--red); color: #fff; font-size: .78rem; line-height: 1.5;
    }

    /* ---------- Filters ---------- */
    .search { margin: 0 0 10px; }
    .search input { margin: 0; }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      flex: 0 0 auto; min-height: 38px; padding: 6px 13px; font-size: .85rem; font-weight: 700;
      background: #fff; color: var(--ink); border: 1px solid var(--line); border-radius: 999px;
    }
    .chip:hover { background: var(--bg); }
    .chip.active { background: var(--green); color: #fff; border-color: var(--green); }
    .chip span { opacity: .7; font-weight: 600; margin-left: 4px; }

    /* ---------- Orders ---------- */
    .order { border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; background: #fff; }
    .order-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .order-id { font-weight: 800; }
    .order small, .muted { color: var(--muted); font-size: .82rem; }
    .order-top > div:first-child { flex: 1 1 auto; min-width: 0; }
    .order-top small { white-space: nowrap; }
    .pills { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex: 0 0 auto; }
    .pill {
      display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .74rem; font-weight: 800;
      text-transform: capitalize; white-space: nowrap; background: var(--bg); color: var(--ink);
    }
    .pill.paid, .pill.delivered { background: var(--ok-bg); color: var(--ok); }
    .pill.pending, .pill.unpaid, .pill.processing { background: var(--amber-bg); color: var(--amber); }
    .pill.failed, .pill.cancelled, .pill.refunded { background: var(--red-bg); color: var(--red); }
    .pill.confirmed, .pill.shipped { background: var(--blue-bg); color: var(--blue); }
    .cust { margin-top: 10px; overflow-wrap: anywhere; }
    .contact { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .contact a {
      display: inline-flex; align-items: center; min-height: 36px; padding: 5px 12px;
      border: 1px solid var(--line); border-radius: 999px; font-size: .85rem; font-weight: 700;
      text-decoration: none; background: #fff;
    }
    .contact a:hover { background: var(--bg); }
    .addr { margin: 4px 0 0; color: var(--ink); }
    .items { margin: 10px 0; padding: 10px 12px; background: var(--bg); border-radius: 12px; font-size: .92rem; }
    .items div { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
    .notes { margin: 8px 0; padding: 9px 12px; background: var(--amber-bg); border-radius: 12px; font-size: .88rem; overflow-wrap: anywhere; white-space: pre-wrap; }
    .order-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 10px; }
    .total { font-weight: 800; font-size: 1.2rem; }
    .status-pick { margin: 0; flex: 1; max-width: 200px; font-size: .78rem; color: var(--muted); }
    .status-pick select { margin-top: 4px; padding: 9px 10px; font-size: 15px; font-weight: 700; }

    /* ---------- Support ---------- */
    .conv {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
      width: 100%; text-align: left; min-height: 0; padding: 13px 4px;
      background: transparent; color: var(--ink); border-radius: 0; border-bottom: 1px solid var(--line);
      font-weight: 400;
    }
    .conv:hover { background: var(--bg); }
    .conv:last-child { border-bottom: 0; }
    .conv-main { min-width: 0; flex: 1; overflow-wrap: anywhere; }
    .conv-main strong { font-size: 1rem; }
    .preview { color: var(--muted); font-size: .88rem; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .conv.needs .preview { color: var(--ink); font-weight: 600; }
    .conv-side { text-align: right; flex: 0 0 auto; }
    .needs-pill { display: inline-block; background: var(--red); color: #fff; font-size: .72rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; margin-bottom: 4px; }

    .thread-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .thread-head h2 { margin: 0; font-size: 1.1rem; overflow-wrap: anywhere; flex: 1; min-width: 0; }
    .thread-head button { flex: 0 0 auto; white-space: nowrap; }
    .closed-pill { display: inline-block; background: #e9eeea; color: var(--muted); font-size: .72rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; margin-bottom: 4px; }
    .closed-note { margin: 0 0 10px; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); font-size: .9rem; }
    #thread-messages { max-height: 52vh; overflow-y: auto; padding: 4px 0 8px; }
    .msg { max-width: 85%; padding: 9px 13px; border-radius: 16px; margin: 8px 0; background: var(--bg); overflow-wrap: anywhere; white-space: pre-wrap; }
    .msg.admin { margin-left: auto; background: var(--green); color: #fff; }
    .msg-meta { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 3px; }
    .msg small { opacity: .7; font-size: .74rem; }
    .msg .del {
      min-height: 30px; padding: 2px 6px; margin: -4px -6px -4px 0; border-radius: 8px;
      background: transparent; color: inherit; opacity: .6; font-size: .74rem; font-weight: 700;
      text-decoration: underline; flex: 0 0 auto;
    }
    .msg .del:hover { opacity: 1; background: #00000014; }
    .msg.admin .del:hover { background: #ffffff26; }
    #reply-form { margin-top: 10px; }
    #reply-text { margin: 0 0 10px; resize: vertical; }
    .empty { color: var(--muted); padding: 10px 0; text-align: center; }
    h2 { font-size: 1.15rem; margin: 0 0 12px; }
    .ver { text-align: center; color: var(--muted); font-size: .72rem; margin: 22px 0 0; opacity: .7; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/admin.html" aria-label="Portexa admin home">Portexa<span>Admin</span></a>
      <div class="top-right">
        <a class="store-link" href="/">← Storefront</a>
        <div class="menu-wrap" id="menu-wrap" hidden>
          <button id="menu-btn" class="menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu" aria-label="Account menu">⋯</button>
          <div id="menu" class="menu" role="menu" hidden>
            <div class="menu-who">Signed in as<b id="menu-email">Administrator</b></div>
            <button id="menu-refresh" type="button" role="menuitem">Refresh data</button>
            <button id="logout" class="danger" type="button" role="menuitem">Sign out</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="status-row">
      <p id="status" role="status">Loading...</p>
      <button id="refresh" class="icon-btn" type="button" aria-label="Refresh data" title="Refresh" hidden><span class="ico">↻</span></button>
    </div>
    <div id="warnings"></div>

    <!-- LOGIN (shown only when signed out) -->
    <section id="login-view" class="card" hidden>
      <h1>Welcome back</h1>
      <p>Sign in to manage orders and customer messages.</p>
      <form id="login-form">
        <label for="email">Email
          <input id="email" type="email" autocomplete="username" required>
        </label>
        <label for="password">Password
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button id="login" class="full" type="submit">Sign in</button>
      </form>
    </section>

    <!-- DASHBOARD (shown only when signed in) -->
    <section id="app-view" hidden>
      <div class="stats">
        <button class="stat" id="stat-needs-card" type="button"><b id="stat-needs">–</b><small>Chats needing a reply</small></button>
        <button class="stat" id="stat-unpaid-card" type="button"><b id="stat-unpaid">–</b><small>Awaiting payment</small></button>
        <button class="stat" id="stat-paid-card" type="button"><b id="stat-paid">–</b><small>Paid orders</small></button>
        <div class="stat"><b id="stat-revenue">–</b><small>Paid total</small></div>
      </div>

      <div class="tabs">
        <button class="tab active" id="tab-orders" type="button">Orders <span id="orders-count" style="opacity:.75"></span></button>
        <button class="tab" id="tab-support" type="button">Support <span id="support-badge" class="count" hidden>0</span></button>
      </div>

      <!-- ORDERS -->
      <section id="panel-orders" class="card">
        <div class="search">
          <input id="order-search" type="search" placeholder="Search name, phone or email" aria-label="Search orders">
        </div>
        <div class="chips" id="order-chips"></div>
        <div id="orders"></div>
      </section>

      <!-- SUPPORT -->
      <section id="panel-support" class="card" hidden>
        <div id="conv-view">
          <div class="chips" id="conv-chips"></div>
          <div id="conversations"></div>
        </div>

        <div id="thread" hidden>
          <div class="thread-head">
            <button id="thread-back" class="ghost small" type="button">← Back</button>
            <h2 id="thread-title">Conversation</h2>
            <button id="thread-close" class="ghost small" type="button">Close chat</button>
          </div>
          <div class="contact" id="thread-contact"></div>
          <p id="closed-note" class="closed-note" hidden>This chat is closed. Reopen it to reply. It also reopens by itself if the customer writes again.</p>
          <div id="thread-messages"></div>
          <form id="reply-form">
            <textarea id="reply-text" required maxlength="4000" rows="3" placeholder="Write your reply..."></textarea>
            <button id="reply-send" type="submit" class="full">Send reply</button>
          </form>
        </div>
      </section>
    </section>
    <p class="ver">Admin v3.1</p>
  </main>

  <script>
    (async () => {
      if (window.__adminStarted) window.__adminStarted();
      const $ = id => document.getElementById(id);
      const statusEl = $('status');

      // Never wait forever: give up with a clear message after a while.
      function withTimeout(promise, ms, message) {
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => reject(new Error(message)), ms);
          promise.then(
            value => { clearTimeout(timer); resolve(value); },
            error => { clearTimeout(timer); reject(error); }
          );
        });
      }
      // Attach a listener without crashing the whole page if an element is missing.
      function on(id, eventName, handler) {
        const el = document.getElementById(id);
        if (el) el.addEventListener(eventName, handler);
        else console.error('Admin page: missing element #' + id);
      }

      const ORDER_STATUSES = ['pending', 'confirmed', 'processing', 'shipped', 'delivered', 'cancelled'];

      let sb;
      let orders = [];
      let conversations = [];
      let orderFilter = 'all';
      let orderQuery = '';
      let convFilter = 'open';
      let activeConversation = null;   // { id, token, name, email, closed }
      let refreshing = false;
      let paymentAvailable = true;   // false when the database has no payment columns yet

      // ---------- helpers ----------
      function esc(value) {
        return String(value ?? '').replace(/[&<>"']/g, c => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[c]);
      }
      const money = n => '\u20A6' + Number(n || 0).toLocaleString('en-NG');
      const fmtDate = v => v ? new Date(v).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '';
      const fmtShort = v => v ? new Date(v).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
      function ago(v) {
        if (!v) return '';
        const mins = Math.round((Date.now() - new Date(v).getTime()) / 60000);
        if (mins < 1) return 'just now';
        if (mins < 60) return mins + ' min ago';
        const hrs = Math.round(mins / 60);
        if (hrs < 24) return hrs + ' h ago';
        const days = Math.round(hrs / 24);
        if (days < 30) return days + ' d ago';
        return new Date(v).toLocaleDateString([], { dateStyle: 'medium' });
      }
      function setStatus(text, kind) {
        statusEl.textContent = text;
        statusEl.className = kind || '';
      }
      function waNumber(phone) {
        let d = String(phone || '').replace(/\D/g, '');
        if (d.startsWith('00')) d = d.slice(2);
        if (d.startsWith('0') && d.length === 11) d = '234' + d.slice(1);
        return d.length >= 10 ? d : '';
      }
      function contactLinks(name, email, phone) {
        const out = [];
        const tel = String(phone || '').replace(/[^\d+]/g, '');
        if (tel) out.push(`<a href="tel:${esc(tel)}">Call</a>`);
        const wa = waNumber(phone);
        if (wa) out.push(`<a href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener noreferrer">WhatsApp</a>`);
        if (email) out.push(`<a href="mailto:${esc(email)}">Email</a>`);
        return out.join('');
      }
      const payOf = o => o.payment_status || '';
      const isAwaiting = o => ['pending', 'unpaid'].includes(payOf(o));

      function showApp(signedIn) {
        $('login-view').hidden = signedIn;
        $('app-view').hidden = !signedIn;
        $('menu-wrap').hidden = !signedIn;
        $('refresh').hidden = !signedIn;
        if (!signedIn) closeMenu();
      }

      // ---------- account menu ----------
      function closeMenu() {
        $('menu').hidden = true;
        $('menu-btn').setAttribute('aria-expanded', 'false');
      }
      function toggleMenu() {
        const open = $('menu').hidden;
        $('menu').hidden = !open;
        $('menu-btn').setAttribute('aria-expanded', String(open));
      }
      on('menu-btn', 'click', event => { event.stopPropagation(); toggleMenu(); });
      document.addEventListener('click', event => {
        if (!$('menu').hidden && !$('menu-wrap').contains(event.target)) closeMenu();
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && !$('menu').hidden) { closeMenu(); $('menu-btn').focus(); }
      });
      on('menu-refresh', 'click', () => { closeMenu(); refresh(); });
      function showTab(name) {
        const isOrders = name === 'orders';
        $('panel-orders').hidden = !isOrders;
        $('panel-support').hidden = isOrders;
        $('tab-orders').classList.toggle('active', isOrders);
        $('tab-support').classList.toggle('active', !isOrders);
      }
      on('tab-orders', 'click', () => showTab('orders'));
      on('tab-support', 'click', () => showTab('support'));

      // ---------- start-up ----------
      try {
        const res = await withTimeout(fetch('/api/config'), 12000,
          'The server did not answer. Check your internet connection and refresh the page.');
        const cfg = await res.json();
        if (!res.ok || !cfg.supabaseUrl || !cfg.supabaseAnonKey) {
          setStatus('Supabase is not configured correctly.', 'err');
          return;
        }
        sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
      } catch (error) {
        console.error('Configuration error:', error);
        setStatus('Could not load configuration: ' + error.message, 'err');
        return;
      }

      async function session() {
        try {
          const { data, error } = await withTimeout(sb.auth.getSession(), 8000,
            'Checking your sign-in took too long. Close other Portexa admin tabs, then refresh.');
          if (error) {
            console.error('Session error:', error.message);
            setStatus('Session error: ' + error.message, 'err');
            return null;
          }
          return data.session;
        } catch (error) {
          console.error('Session error:', error.message);
          setStatus(error.message, 'err');
          return null;
        }
      }

      // ---------- summary ----------
      function renderStats() {
        const needs = conversations.filter(c => c.needs_reply).length;
        const hasPayment = paymentAvailable;
        const paid = orders.filter(o => payOf(o) === 'paid');
        $('stat-needs').textContent = needs;
        $('stat-needs-card').classList.toggle('alert', needs > 0);
        $('stat-unpaid').textContent = hasPayment ? orders.filter(isAwaiting).length : '–';
        $('stat-paid').textContent = hasPayment ? paid.length : '–';
        $('stat-revenue').textContent = hasPayment
          ? money(paid.reduce((sum, o) => sum + Number(o.subtotal || 0), 0)) : '–';
        $('orders-count').textContent = orders.length ? '(' + orders.length + ')' : '';
        const badge = $('support-badge');
        badge.textContent = needs;
        badge.hidden = needs === 0;
        document.title = (needs ? '(' + needs + ') ' : '') + 'Portexa | Admin';
      }

      // ---------- orders ----------
      const ORDER_CHIPS = [
        ['all', 'All', () => true],
        ['awaiting', 'Awaiting payment', isAwaiting],
        ['paid', 'Paid', o => payOf(o) === 'paid'],
        ['shipped', 'Shipped', o => o.status === 'shipped'],
        ['delivered', 'Delivered', o => o.status === 'delivered'],
        ['cancelled', 'Cancelled', o => o.status === 'cancelled']
      ];

      function matchesQuery(o, q) {
        if (!q) return true;
        const hay = [o.id, o.customer_name, o.customer_email, o.customer_phone]
          .map(v => String(v || '').toLowerCase()).join(' ');
        return hay.includes(q);
      }

      function renderOrderChips() {
        $('order-chips').innerHTML = ORDER_CHIPS.map(([key, label, fn]) => {
          const n = orders.filter(fn).length;
          return `<button type="button" class="chip${orderFilter === key ? ' active' : ''}" data-chip="${key}">${label}<span>${n}</span></button>`;
        }).join('');
        $('order-chips').querySelectorAll('[data-chip]').forEach(b =>
          b.addEventListener('click', () => { orderFilter = b.dataset.chip; renderOrders(); }));
      }

      function orderCard(o) {
        const items = (Array.isArray(o.items) ? o.items : []).map(i => {
          const line = i.line_total != null ? money(i.line_total) : '';
          return `<div><span>${esc(i.name)} \u00D7 ${esc(i.quantity)}</span><span>${esc(line)}</span></div>`;
        }).join('');
        const statuses = ORDER_STATUSES.includes(o.status) || !o.status
          ? ORDER_STATUSES : [o.status, ...ORDER_STATUSES];
        const options = statuses.map(s =>
          `<option value="${esc(s)}"${s === o.status ? ' selected' : ''}>${esc(s.charAt(0).toUpperCase() + s.slice(1))}</option>`).join('');
        const pay = payOf(o);
        return `
          <article class="order" data-order="${esc(o.id)}">
            <div class="order-top">
              <div>
                <div class="order-id">#${esc(String(o.id || '').slice(0, 8))}</div>
                <small>${esc(fmtDate(o.created_at))}</small>
              </div>
              <div class="pills">
                ${pay ? `<span class="pill ${esc(pay)}">${esc(pay)}</span>` : ''}
                <span class="pill ${esc(o.status || '')}">${esc(o.status || 'unknown')}</span>
              </div>
            </div>
            <div class="cust">
              <strong>${esc(o.customer_name)}</strong>
              <div class="contact">${contactLinks(o.customer_name, o.customer_email, o.customer_phone)}</div>
              <div class="muted">${esc(o.customer_phone)} \u00B7 ${esc(o.customer_email)}</div>
              <p class="addr">${esc(o.delivery_address)}</p>
            </div>
            <div class="items">${items || '<small>No items</small>'}</div>
            ${o.notes ? `<div class="notes"><strong>Customer note:</strong> ${esc(o.notes)}</div>` : ''}
            <div class="order-foot">
              <div class="total">${money(o.subtotal)}</div>
              <label class="status-pick">Order status
                <select data-id="${esc(o.id)}" data-current="${esc(o.status || '')}" aria-label="Order status">${options}</select>
              </label>
            </div>
          </article>`;
      }

      function renderOrders() {
        renderOrderChips();
        const chip = ORDER_CHIPS.find(c => c[0] === orderFilter) || ORDER_CHIPS[0];
        const q = orderQuery.trim().toLowerCase();
        const list = orders.filter(chip[2]).filter(o => matchesQuery(o, q));
        if (!orders.length) {
          $('orders').innerHTML = '<p class="empty">No orders yet. New orders will appear here.</p>';
          return;
        }
        if (!list.length) {
          $('orders').innerHTML = '<p class="empty">No orders match this filter.</p>';
          return;
        }
        $('orders').innerHTML = list.map(orderCard).join('');
        $('orders').querySelectorAll('select[data-id]').forEach(sel =>
          sel.addEventListener('change', () => changeOrderStatus(sel)));
      }

      on('order-search', 'input', event => {
        orderQuery = event.target.value;
        renderOrders();
      });

      async function changeOrderStatus(sel) {
        const id = sel.dataset.id;
        const previous = sel.dataset.current;
        const next = sel.value;
        if (next === previous) return;
        sel.disabled = true;
        try {
          const s = await session();
          if (!s) { showApp(false); setStatus('Please sign in again.', 'err'); return; }
          const response = await fetch('/api/admin/order-status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + s.access_token },
            body: JSON.stringify({ orderId: id, status: next })
          });
          let data = {};
          try { data = await response.json(); } catch (e) {}
          if (!response.ok) throw new Error(data.error || 'The order status could not be saved.');
          const order = orders.find(o => o.id === id);
          if (order) order.status = next;
          renderOrders();
          setStatus('Order #' + id.slice(0, 8) + ' marked as ' + next + '.', 'ok');
        } catch (error) {
          sel.value = previous;
          setStatus(error.message, 'err');
        } finally {
          sel.disabled = false;
        }
      }

      // ---------- support ----------
      const isClosed = c => c.closed === true || c.status === 'closed';

      function renderConvChips() {
        const needs = conversations.filter(c => c.needs_reply).length;
        const open = conversations.filter(c => !isClosed(c)).length;
        const closed = conversations.length - open;
        const chips = [['open', 'Open', open], ['needs', 'Needs reply', needs], ['closed', 'Closed', closed]];
        $('conv-chips').innerHTML = chips.map(([key, label, n]) =>
          `<button type="button" class="chip${convFilter === key ? ' active' : ''}" data-conv-chip="${key}">${label}<span>${n}</span></button>`).join('');
        $('conv-chips').querySelectorAll('[data-conv-chip]').forEach(b =>
          b.addEventListener('click', () => { convFilter = b.dataset.convChip; renderConversations(); }));
      }

      function renderConversations() {
        renderConvChips();
        let list = conversations.slice();
        if (convFilter === 'needs') list = list.filter(c => c.needs_reply);
        else if (convFilter === 'closed') list = list.filter(isClosed);
        else list = list.filter(c => !isClosed(c));
        // Conversations waiting for a reply first, then newest activity.
        list.sort((a, b) => (b.needs_reply - a.needs_reply) ||
          (new Date(b.last_message_at || b.updated_at || 0) - new Date(a.last_message_at || a.updated_at || 0)));
        if (!conversations.length) {
          $('conversations').innerHTML = '<p class="empty">No conversations yet. Customer chats will appear here.</p>';
          return;
        }
        if (!list.length) {
          const text = convFilter === 'closed' ? 'No closed chats.'
            : convFilter === 'needs' ? 'Nothing is waiting for a reply. \u2713'
            : 'No open chats right now. \u2713';
          $('conversations').innerHTML = '<p class="empty">' + text + '</p>';
          return;
        }
        $('conversations').innerHTML = list.map(c => `
          <button type="button" class="conv${c.needs_reply ? ' needs' : ''}"
                  data-id="${esc(c.id)}" data-token="${esc(c.visitor_token)}"
                  data-name="${esc(c.name)}" data-email="${esc(c.email)}">
            <span class="conv-main">
              <strong>${esc(c.name)}</strong><br>
              <small class="muted">${esc(c.email)}</small>
              <span class="preview">${esc(c.last_message || 'No messages yet')}</span>
            </span>
            <span class="conv-side">
              ${c.needs_reply ? '<span class="needs-pill">Needs reply</span><br>' : ''}
              ${isClosed(c) ? '<span class="closed-pill">Closed</span><br>' : ''}
              <small class="muted">${esc(ago(c.last_message_at || c.updated_at || c.created_at))}</small>
            </span>
          </button>`).join('');
        $('conversations').querySelectorAll('button[data-id]').forEach(b =>
          b.addEventListener('click', () =>
            openThread(b.dataset.id, b.dataset.token, b.dataset.name, b.dataset.email)));
      }

      function closeThread() {
        activeConversation = null;
        $('thread').hidden = true;
        $('conv-view').hidden = false;
      }
      on('thread-back', 'click', () => {
        closeThread();
        refresh(true);
      });

      function applyThreadState() {
        const closed = !!(activeConversation && activeConversation.closed);
        $('closed-note').hidden = !closed;
        $('reply-form').hidden = closed;
        $('thread-close').textContent = closed ? 'Reopen chat' : 'Close chat';
      }

      async function openThread(id, token, name, email) {
        const known = conversations.find(c => c.id === id);
        activeConversation = { id, token, name, email, closed: !!(known && isClosed(known)) };
        applyThreadState();
        $('conv-view').hidden = true;
        $('thread').hidden = false;
        $('thread-title').textContent = name || 'Conversation';
        $('thread-contact').innerHTML = contactLinks(name, email, '');
        $('thread-messages').innerHTML = '<p class="empty">Loading messages...</p>';
        await loadThread();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      async function loadThread() {
        if (!activeConversation) return;
        const token = activeConversation.token;
        try {
          const response = await fetch('/api/chat?visitorToken=' + encodeURIComponent(token), { cache: 'no-store' });
          const data = await response.json();
          if (!activeConversation || activeConversation.token !== token) return;
          if (!response.ok) {
            setStatus(data.error || 'Could not load conversation messages.', 'err');
            return;
          }
          const messages = Array.isArray(data.messages) ? data.messages : [];
          const box = $('thread-messages');
          const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
          box.innerHTML = '';
          if (!messages.length) {
            box.innerHTML = '<p class="empty">No messages yet.</p>';
            return;
          }
          messages.forEach(m => {
            const div = document.createElement('div');
            div.className = 'msg' + (m.sender_role === 'admin' ? ' admin' : '');
            const row = document.createElement('div');
            row.className = 'msg-meta';
            const meta = document.createElement('small');
            meta.textContent = (m.sender_role === 'admin' ? 'Portexa' : 'Customer') + ' \u00B7 ' + fmtShort(m.created_at);
            row.appendChild(meta);
            if (m.id) {
              const del = document.createElement('button');
              del.type = 'button';
              del.className = 'del';
              del.textContent = 'Delete';
              del.setAttribute('aria-label', 'Delete this message');
              del.addEventListener('click', () => deleteMessage(m.id));
              row.appendChild(del);
            }
            const body = document.createElement('span');
            body.textContent = m.message || '';
            div.append(row, body);
            box.appendChild(div);
          });
          if (nearBottom || box.dataset.fresh !== token) box.scrollTop = box.scrollHeight;
          box.dataset.fresh = token;
        } catch (error) {
          console.error('Conversation loading error:', error);
          setStatus('Could not load messages: ' + error.message, 'err');
        }
      }

      // ---------- chat actions: delete a message, close / reopen a chat ----------
      async function chatAction(payload, okText) {
        const s = await session();
        if (!s) { showApp(false); setStatus('Please sign in again.', 'err'); return false; }
        try {
          const response = await fetch('/api/admin/reply', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + s.access_token },
            body: JSON.stringify(payload)
          });
          let data = {};
          try { data = await response.json(); } catch (e) {}
          if (!response.ok) {
            setStatus(data.error || 'That action could not be completed.', 'err');
            return false;
          }
          setStatus(okText, 'ok');
          return true;
        } catch (error) {
          console.error('Chat action error:', error);
          setStatus('That action could not be completed: ' + error.message, 'err');
          return false;
        }
      }

      async function deleteMessage(messageId) {
        if (!activeConversation) return;
        if (!window.confirm('Delete this message permanently? The customer will no longer see it either.')) return;
        const ok = await chatAction(
          { action: 'delete', conversationId: activeConversation.id, messageId },
          'Message deleted.');
        if (ok) { await loadThread(); refresh(true); }
      }

      on('thread-close', 'click', async () => {
        if (!activeConversation) return;
        const closing = !activeConversation.closed;
        if (closing && !window.confirm('Close this chat? You can reopen it later, and it reopens by itself if the customer writes again.')) return;
        const id = activeConversation.id;
        const ok = await chatAction(
          { action: closing ? 'close' : 'reopen', conversationId: id },
          closing ? 'Chat closed.' : 'Chat reopened.');
        if (!ok) return;
        const c = conversations.find(x => x.id === id);
        if (c) {
          c.status = closing ? 'closed' : 'open';
          c.closed = closing;
          if (closing) c.needs_reply = false;
        }
        renderStats();
        if (closing) {
          closeThread();
          renderConversations();
        } else if (activeConversation) {
          activeConversation.closed = false;
          applyThreadState();
        }
        refresh(true);
      });

      // ---------- load everything ----------
      async function refresh(quiet) {
        if (refreshing) return;
        refreshing = true;
        $('refresh').classList.add('spin');
        try {
          const s = await session();
          if (!s) {
            showApp(false);
            // keep an explanatory error (for example a timeout) visible
            if (statusEl.className !== 'err') setStatus('Sign in with your administrator account.');
            return;
          }
          showApp(true);
          $('menu-email').textContent = (s.user && s.user.email) || 'Administrator';
          if (!quiet) setStatus('Signed in. Loading dashboard data...');

          const response = await fetch('/api/admin/data', {
            headers: { Authorization: 'Bearer ' + s.access_token }
          });
          const raw = await response.text();
          let data = {};
          try { data = JSON.parse(raw); } catch (e) {}

          if (!response.ok) {
            setStatus('Could not load dashboard (HTTP ' + response.status + '): ' +
              (data.error || raw.slice(0, 200) || 'No response from server'), 'err');
            return;
          }

          orders = Array.isArray(data.orders) ? data.orders : [];
          conversations = Array.isArray(data.conversations) ? data.conversations : [];
          paymentAvailable = data.paymentColumns !== false;
          $('warnings').innerHTML = (Array.isArray(data.warnings) ? data.warnings : [])
            .map(w => `<div class="warning">${esc(w)}</div>`).join('');

          renderStats();
          // Do not redraw the order list while the admin is typing or choosing a status.
          const busy = quiet && $('orders').contains(document.activeElement) ||
                       quiet && document.activeElement === $('order-search');
          if (!busy) renderOrders();
          if (!activeConversation) renderConversations();
          if (!quiet) setStatus('Admin data loaded.', 'ok');
        } catch (error) {
          console.error('Dashboard loading error:', error);
          setStatus('Could not load dashboard data: ' + error.message, 'err');
        } finally {
          refreshing = false;
          $('refresh').classList.remove('spin');
        }
      }

      // ---------- sign in / out ----------
      on('login-form', 'submit', async event => {
        event.preventDefault();
        const button = $('login');
        button.disabled = true;
        button.textContent = 'Signing in...';
        try {
          const { error } = await withTimeout(sb.auth.signInWithPassword({
            email: $('email').value.trim(),
            password: $('password').value
          }), 20000, 'Sign-in took too long. Check your connection and try again.');
          if (error) {
            setStatus('Login failed: ' + error.message, 'err');
            return;
          }
          $('password').value = '';
          await refresh();
        } catch (error) {
          console.error('Login error:', error);
          setStatus(error && error.message ? error.message : 'Login failed. Please try again.', 'err');
        } finally {
          button.disabled = false;
          button.textContent = 'Sign in';
        }
      });

      on('logout', 'click', async () => {
        closeMenu();
        const { error } = await sb.auth.signOut();
        if (error) {
          setStatus('Could not sign out: ' + error.message, 'err');
          return;
        }
        closeThread();
        orders = [];
        conversations = [];
        showApp(false);
        setStatus('Signed out.');
      });

      on('refresh', 'click', () => refresh());
      on('stat-needs-card', 'click', () => {
        closeThread(); convFilter = 'needs'; renderConversations(); showTab('support');
      });
      on('stat-unpaid-card', 'click', () => {
        orderFilter = 'awaiting'; renderOrders(); showTab('orders');
      });
      on('stat-paid-card', 'click', () => {
        orderFilter = 'paid'; renderOrders(); showTab('orders');
      });

      // ---------- replying ----------
      on('reply-form', 'submit', async event => {
        event.preventDefault();
        const message = $('reply-text').value.trim();
        if (!message || !activeConversation) {
          setStatus('Open a conversation before replying.', 'err');
          return;
        }
        const button = $('reply-send');
        button.disabled = true;
        try {
          const s = await session();
          if (!s) {
            setStatus('Please sign in again.', 'err');
            showApp(false);
            return;
          }
          const response = await fetch('/api/admin/reply', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + s.access_token },
            body: JSON.stringify({ conversationId: activeConversation.id, message })
          });
          const data = await response.json();
          if (!response.ok) {
            setStatus(data.error || 'Reply could not be sent.', 'err');
            return;
          }
          $('reply-text').value = '';
          await loadThread();
          setStatus('Reply sent.', 'ok');
          refresh(true);
        } catch (error) {
          console.error('Reply error:', error);
          setStatus('Could not send reply: ' + error.message, 'err');
        } finally {
          button.disabled = false;
        }
      });

      await refresh();

      // Open conversation refreshes quickly; the lists refresh quietly every 30 seconds.
      setInterval(() => {
        if (activeConversation && !document.hidden) loadThread().catch(console.error);
      }, 10000);
      setInterval(() => {
        if (!document.hidden && !$('app-view').hidden) refresh(true);
      }, 30000);
    })();
  </script>
</body>
</html>
