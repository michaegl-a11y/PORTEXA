<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portexa | Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --green: #14392f;
      --green-2: #1d5242;
      --gold: #c9a24b;
      --cream: #f6f1e4;
      --bg: #f4f5f1;
      --line: #e2e7e3;
      --muted: #66736c;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--green);
      -webkit-text-size-adjust: 100%;
    }
    .topbar {
      background: var(--green);
      color: var(--cream);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand { font-size: 20px; font-weight: 700; letter-spacing: .3px; }
    .brand span { color: var(--gold); font-weight: 500; margin-left: 6px; }
    .topbar a { color: var(--cream); font-size: 14px; opacity: .85; text-decoration: none; }
    .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
    #status { color: var(--muted); font-size: 14px; margin: 4px 0 14px; overflow-wrap: anywhere; }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 14px #0000000d;
    }
    h1, h2, h3 { margin: 0 0 12px; }
    h2 { font-size: 20px; }

    #login-view { max-width: 420px; margin: 28px auto 0; }
    #login-view h1 { font-size: 26px; }
    #login-view p { color: var(--muted); margin: 0 0 18px; }
    label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 14px; }
    input, textarea {
      display: block; width: 100%; margin-top: 6px; padding: 13px;
      font: inherit; font-size: 16px; color: var(--green);
      border: 1px solid #ccd6d0; border-radius: 10px; background: #fff;
    }
    input:focus, textarea:focus { outline: 2px solid var(--gold); border-color: var(--gold); }

    button {
      font: inherit; font-weight: 600; padding: 12px 18px; border: 0;
      border-radius: 10px; background: var(--green); color: #fff; cursor: pointer;
    }
    button:hover { background: var(--green-2); }
    button:disabled { opacity: .6; cursor: default; }
    button.ghost { background: transparent; color: var(--green); border: 1px solid #ccd6d0; }
    button.ghost:hover { background: var(--cream); }
    .full { width: 100%; }

    .toolbar { display: flex; gap: 10px; margin-bottom: 14px; }
    .toolbar button { flex: 1; }
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .stat { background: #fff; border-radius: 16px; padding: 16px; box-shadow: 0 2px 14px #0000000d; }
    .stat b { display: block; font-size: 28px; }
    .stat small { color: var(--muted); }

    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab { flex: 1; background: #fff; color: var(--green); border: 1px solid var(--line); }
    .tab.active { background: var(--green); color: #fff; border-color: var(--green); }

    .order { border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 12px; background: #fff; }
    .order-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .order-id { font-weight: 700; }
    .order small, .conv small { color: var(--muted); }
    .badge {
      display: inline-block; padding: 4px 10px; border-radius: 999px;
      background: var(--cream); color: #7a5d12; font-size: 12px; font-weight: 700;
      text-transform: capitalize; white-space: nowrap;
    }
    .order-body { margin-top: 10px; font-size: 15px; line-height: 1.5; overflow-wrap: anywhere; }
    .items { margin: 10px 0; padding: 10px 12px; background: var(--bg); border-radius: 10px; }
    .total { font-weight: 700; font-size: 17px; }

    .conv { display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 14px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
    .conv:last-child { border-bottom: 0; }
    .conv button { padding: 10px 14px; white-space: nowrap; }

    #thread-messages { max-height: 55vh; overflow-y: auto; padding: 4px 0 8px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; margin: 8px 0;
      background: var(--bg); overflow-wrap: anywhere; white-space: pre-wrap; }
    .msg.admin { margin-left: auto; background: var(--green); color: #fff; }
    .msg small { display: block; opacity: .7; margin-bottom: 4px; font-size: 12px; }
    #reply-form { margin-top: 12px; }
    #reply-text { margin-bottom: 10px; resize: vertical; }
    .empty { color: var(--muted); padding: 8px 0; }

    @media (min-width: 700px) {
      .stats { grid-template-columns: repeat(2, 200px); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">Portexa<span>Admin</span></div>
    <a href="/">← Storefront</a>
  </header>

  <main class="wrap">
    <p id="status">Loading...</p>

    <!-- LOGIN (shown only when signed out) -->
    <section id="login-view" class="card" hidden>
      <h1>Welcome back</h1>
      <p>Sign in to manage orders and customer messages.</p>
      <form id="login-form">
        <label for="email">Email
          <input id="email" type="email" autocomplete="username" required>
        </label>
        <label for="password">Password
          <input id="password" type="password" autocomplete="current-password" required>
        </label>
        <button id="login" class="full" type="submit">Sign in</button>
      </form>
    </section>

    <!-- DASHBOARD (shown only when signed in) -->
    <section id="app-view" hidden>
      <div class="toolbar">
        <button id="refresh" class="ghost" type="button">Refresh data</button>
        <button id="logout" class="ghost" type="button">Sign out</button>
      </div>

      <div class="stats">
        <div class="stat"><b id="stat-orders">–</b><small>Orders</small></div>
        <div class="stat"><b id="stat-convos">–</b><small>Conversations</small></div>
      </div>

      <div class="tabs">
        <button class="tab active" id="tab-orders" type="button">Orders</button>
        <button class="tab" id="tab-support" type="button">Support</button>
      </div>

      <section id="panel-orders" class="card">
        <h2>Orders</h2>
        <div id="orders"></div>
      </section>

      <section id="panel-support" class="card" hidden>
        <h2>Support conversations</h2>
        <div id="conversations"></div>

        <div id="thread" hidden>
          <hr style="border:0;border-top:1px solid var(--line);margin:18px 0">
          <h3 id="thread-title">Conversation</h3>
          <div id="thread-messages"></div>
          <form id="reply-form">
            <textarea id="reply-text" required maxlength="4000" rows="3" placeholder="Write your reply..."></textarea>
            <button type="submit" class="full">Send reply</button>
          </form>
        </div>
      </section>
    </section>
  </main>

  <script>
    (async () => {
      const $ = id => document.getElementById(id);
      const status = $('status');

      let sb;
      let activeConversation = null;
      let activeToken = null;

      function esc(value) {
        return String(value ?? '').replace(/[&<>"']/g, c => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[c]);
      }
      const fmtDate = v => v ? new Date(v).toLocaleString() : '';

      function showApp(signedIn) {
        $('login-view').hidden = signedIn;
        $('app-view').hidden = !signedIn;
      }

      function showTab(name) {
        const orders = name === 'orders';
        $('panel-orders').hidden = !orders;
        $('panel-support').hidden = orders;
        $('tab-orders').classList.toggle('active', orders);
        $('tab-support').classList.toggle('active', !orders);
      }
      $('tab-orders').addEventListener('click', () => showTab('orders'));
      $('tab-support').addEventListener('click', () => showTab('support'));

      try {
        const res = await fetch('/api/config');
        const cfg = await res.json();
        if (!res.ok || !cfg.supabaseUrl || !cfg.supabaseAnonKey) {
          status.textContent = 'Supabase is not configured correctly.';
          return;
        }
        sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
      } catch (error) {
        console.error('Configuration error:', error);
        status.textContent = 'Could not load configuration: ' + error.message;
        return;
      }

      async function session() {
        const { data, error } = await sb.auth.getSession();
        if (error) {
          console.error('Session error:', error.message);
          status.textContent = 'Session error: ' + error.message;
          return null;
        }
        return data.session;
      }

      function renderOrders(orders) {
        $('stat-orders').textContent = orders.length;
        if (!orders.length) {
          $('orders').innerHTML = '<p class="empty">No orders yet.</p>';
          return;
        }
        $('orders').innerHTML = orders.map(o => {
          const items = (Array.isArray(o.items) ? o.items : [])
            .map(i => `${esc(i.name)} × ${esc(i.quantity)}`).join('<br>');
          return `
            <div class="order">
              <div class="order-head">
                <div>
                  <div class="order-id">#${esc(String(o.id || '').slice(0, 8))}</div>
                  <small>${esc(fmtDate(o.created_at))}</small>
                </div>
                <span class="badge">${esc(o.status || 'Unknown')}</span>
              </div>
              <div class="order-body">
                <strong>${esc(o.customer_name)}</strong><br>
                ${esc(o.customer_email)}<br>
                ${esc(o.customer_phone)}<br>
                ${esc(o.delivery_address)}
                <div class="items">${items || '<small>No items</small>'}</div>
                <div class="total">₦${Number(o.subtotal || 0).toLocaleString('en-NG')}</div>
              </div>
            </div>`;
        }).join('');
      }

      function renderConversations(list) {
        $('stat-convos').textContent = list.length;
        if (!list.length) {
          $('conversations').innerHTML = '<p class="empty">No conversations yet.</p>';
          return;
        }
        $('conversations').innerHTML = list.map(c => `
          <div class="conv">
            <div>
              <strong>${esc(c.name)}</strong><br>
              <small>${esc(c.email)}</small><br>
              <small>${esc(c.status)} · ${esc(fmtDate(c.updated_at || c.created_at))}</small>
            </div>
            <button type="button" data-id="${esc(c.id)}" data-token="${esc(c.visitor_token)}" data-name="${esc(c.name)}">Open</button>
          </div>`).join('');

        $('conversations').querySelectorAll('button[data-id]').forEach(b => {
          b.addEventListener('click', () =>
            openThread(b.dataset.id, b.dataset.token, b.dataset.name));
        });
      }

      async function refresh() {
        const s = await session();
        if (!s) {
          showApp(false);
          status.textContent = 'Sign in with your administrator account.';
          return;
        }
        showApp(true);
        status.textContent = 'Signed in. Loading dashboard data...';

        try {
          const response = await fetch('/api/admin/data', {
            headers: { Authorization: 'Bearer ' + s.access_token }
          });
          const raw = await response.text();
          let data = {};
          try { data = JSON.parse(raw); } catch (e) {}

          if (!response.ok) {
            status.textContent = 'Could not load dashboard (HTTP ' + response.status + '): ' +
              (data.error || raw.slice(0, 200) || 'No response from server');
            return;
          }

          renderOrders(Array.isArray(data.orders) ? data.orders : []);
          renderConversations(Array.isArray(data.conversations) ? data.conversations : []);
          status.textContent = 'Admin data loaded.';
        } catch (error) {
          console.error('Dashboard loading error:', error);
          status.textContent = 'Could not load dashboard data: ' + error.message;
        }
      }

      async function openThread(id, token, name) {
        activeConversation = id;
        activeToken = token;
        $('thread').hidden = false;
        $('thread-title').textContent = 'Conversation with ' + name;
        await loadThread();
        $('thread').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      async function loadThread() {
        if (!activeToken) return;
        try {
          const response = await fetch('/api/chat?visitorToken=' + encodeURIComponent(activeToken));
          const data = await response.json();
          if (!response.ok) {
            status.textContent = data.error || 'Could not load conversation messages.';
            return;
          }
          const messages = Array.isArray(data.messages) ? data.messages : [];
          const box = $('thread-messages');
          box.innerHTML = '';
          if (!messages.length) {
            box.innerHTML = '<p class="empty">No messages yet.</p>';
            return;
          }
          messages.forEach(m => {
            const div = document.createElement('div');
            div.className = 'msg' + (m.sender_role === 'admin' ? ' admin' : '');
            const meta = document.createElement('small');
            meta.textContent = (m.sender_role === 'admin' ? 'Portexa' : 'Customer') +
              ' · ' + fmtDate(m.created_at);
            const body = document.createElement('span');
            body.textContent = m.message || '';
            div.append(meta, body);
            box.appendChild(div);
          });
          box.scrollTop = box.scrollHeight;
        } catch (error) {
          console.error('Conversation loading error:', error);
          status.textContent = 'Could not load messages: ' + error.message;
        }
      }

      $('login-form').addEventListener('submit', async event => {
        event.preventDefault();
        const button = $('login');
        button.disabled = true;
        button.textContent = 'Signing in...';
        try {
          const { error } = await sb.auth.signInWithPassword({
            email: $('email').value.trim(),
            password: $('password').value
          });
          if (error) {
            status.textContent = 'Login failed: ' + error.message;
            return;
          }
          $('password').value = '';
          await refresh();
        } catch (error) {
          console.error('Login error:', error);
          status.textContent = 'Login failed. Please try again.';
        } finally {
          button.disabled = false;
          button.textContent = 'Sign in';
        }
      });

      $('logout').addEventListener('click', async () => {
        const { error } = await sb.auth.signOut();
        if (error) {
          status.textContent = 'Could not sign out: ' + error.message;
          return;
        }
        activeConversation = null;
        activeToken = null;
        $('thread').hidden = true;
        showApp(false);
        status.textContent = 'Signed out.';
      });

      $('refresh').addEventListener('click', refresh);

      $('reply-form').addEventListener('submit', async event => {
        event.preventDefault();
        const message = $('reply-text').value.trim();
        if (!message || !activeConversation) {
          status.textContent = 'Open a conversation before replying.';
          return;
        }
        const s = await session();
        if (!s) {
          status.textContent = 'Please sign in again.';
          showApp(false);
          return;
        }
        try {
          const response = await fetch('/api/admin/reply', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: 'Bearer ' + s.access_token
            },
            body: JSON.stringify({ conversationId: activeConversation, message })
          });
          const data = await response.json();
          if (!response.ok) {
            status.textContent = data.error || 'Reply could not be sent.';
            return;
          }
          $('reply-text').value = '';
          await loadThread();
          status.textContent = 'Reply sent.';
        } catch (error) {
          console.error('Reply error:', error);
          status.textContent = 'Could not send reply: ' + error.message;
        }
      });

      await refresh();

      setInterval(() => {
        if (activeConversation) loadThread().catch(console.error);
      }, 15000);
    })();
  </script>
</body>
</html>
