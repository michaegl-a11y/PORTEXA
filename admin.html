<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portexa | Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
body{font-family:system-ui,sans-serif;background:#f6f7f4;color:#183e35;margin:0;padding:20px}.wrap{max-width:1100px;margin:auto}.card{background:#fff;border-radius:14px;padding:18px;margin:16px 0;box-shadow:0 4px 20px #0000000b}input,textarea,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #ccd6d0}button{background:#17483b;color:white;border:0;cursor:pointer;margin:4px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #e3e8e4;vertical-align:top}small,#status{color:#66736c}.scroll{overflow:auto}.chatrow{border-bottom:1px solid #e3e8e4;padding:12px 0}
<style>* {
    box-sizing: border-box;
    }

body {
font-family: system-ui, sans-serif;
background: #f6f7f4;
color: #183e35;
margin: 0;
padding: 20px;
}

.wrap {
max-width: 1100px;
margin: auto;
}

.card {
background: #fff;
border-radius: 14px;
padding: 22px;
margin: 20px 0;
box-shadow: 0 4px 20px #0000000b;
}

h1, h2, h3 {
margin-top: 0;
}

#login-card {
max-width: 520px;
}

#login-form label {
display: block;
margin-bottom: 16px;
font-weight: 600;
}

#login-form input {
display: block;
width: 100%;
margin-top: 7px;
padding: 13px;
}

button {
font: inherit;
padding: 12px 18px;
border: 0;
border-radius: 8px;
background: #17483b;
color: white;
cursor: pointer;
}

button:hover {
background: #236653;
}

#login {
width: 100%;
}

#dashboard-controls {
display: flex;
flex-wrap: wrap;
gap: 12px;
align-items: center;
}

#dashboard-controls button {
min-height: 44px;
}

#status {
color: #66736c;
overflow-wrap: anywhere;
}

#orders,
#conversations,
#thread-messages {
min-width: 0;
}

.scroll {
width: 100%;
overflow-x: auto;
}

table {
width: 100%;
min-width: 750px;
border-collapse: collapse;
}

td, th {
text-align: left;
padding: 12px;
border-bottom: 1px solid #e3e8e4;
vertical-align: top;
}

small {
color: #66736c;
}

.chatrow {
border-bottom: 1px solid #e3e8e4;
padding: 14px 0;
overflow-wrap: anywhere;
}

#thread {
margin-top: 22px;
padding-top: 18px;
border-top: 1px solid #e3e8e4;
}

#thread-messages {
max-height: 400px;
overflow-y: auto;
padding: 8px 0;
}

#thread-messages p {
white-space: pre-wrap;
overflow-wrap: anywhere;
}

#reply-form {
margin-top: 16px;
}

#reply-text {
display: block;
width: 100%;
padding: 12px;
margin-bottom: 10px;
resize: vertical;
}

@media (max-width: 600px) {
body {
padding: 12px;
}

.card {
padding: 16px;
}

h1 {
font-size: 26px;
}

#dashboard-controls {
align-items: stretch;
}

#dashboard-controls button {
flex: 1 1 140px;
}
}</style>
<script>
(async()=>{const $=id=>document.getElementById(id);const status=$('status');let sb,activeConversation=null,activeToken=null;
const cfg=await fetch('/api/config').then(r=>r.json());if(!cfg.supabaseUrl||!cfg.supabaseAnonKey){status.textContent='Supabase is not configured.';return;}sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);
async function session() {
  const { data, error } = await sb.auth.getSession();
  if (error) {
    console.error('Session error:', error.message);
    status.textContent = 'Session error: ' + error.message;
    return null;
  }
  console.log('Session available:', !!data.session);
  return data.session;
}
async function refresh(){const s=await session();if(!s){$('orders').textContent='Sign in first.';$('conversations').textContent='Sign in first.';return;}const r=await fetch('/api/admin/data',{headers:{Authorization:'Bearer '+s.access_token}});const d=await r.json();if(!r.ok){status.textContent=d.error||'Admin access required.';return;}status.textContent='Signed in. Admin data loaded.';$('orders').innerHTML='<table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Order status</th></tr></thead><tbody>'+d.orders.map(o=>`<tr><td>${o.id.slice(0,8)}<br><small>${new Date(o.created_at).toLocaleString()}</small></td><td>${o.customer_name}<br>${o.customer_email}<br>${o.customer_phone}<br>${o.delivery_address}</td><td>${(o.items||[]).map(i=>`${i.name} × ${i.quantity}`).join('<br>')}</td><td>₦${Number(o.subtotal).toLocaleString('en-NG')}</td><td>${o.payment_status||'unpaid'}<br><small>${o.payment_reference||''}</small></td><td>${o.status}</td></tr>`).join('')+'</tbody></table>';
$('conversations').innerHTML=d.conversations.length?d.conversations.map(c=>`<div class="chatrow"><strong>${c.name}</strong> · ${c.email}<br><small>${c.status} · ${new Date(c.updated_at||c.created_at).toLocaleString()}</small><br><button data-id="${c.id}" data-token="${c.visitor_token}" data-name="${c.name.replace(/"/g,'&quot;')}">Open conversation</button></div>`).join(''):'No conversations yet.';
$('conversations').querySelectorAll('button').forEach(b=>b.onclick=()=>openThread(b.dataset.id,b.dataset.token,b.dataset.name));
}
async function openThread(id,token,name){activeConversation=id;activeToken=token;$('thread').style.display='block';$('thread-title').textContent='Conversation with '+name;await loadThread();}
async function loadThread(){const r=await fetch('/api/chat?visitorToken='+encodeURIComponent(activeToken));const d=await r.json();$('thread-messages').innerHTML=(d.messages||[]).map(m=>`<div class="chatrow"><strong>${m.sender_role==='admin'?'Portexa':'Customer'}</strong> · <small>${new Date(m.created_at).toLocaleString()}</small><p style="white-space:pre-wrap"></p></div>`).join('');[...$('thread-messages').querySelectorAll('p')].forEach((p,i)=>p.textContent=d.messages[i].message);}
$('login').onclick = async () => {
  const { data, error } = await sb.auth.signInWithPassword({
    email: $('email').value.trim(),
    password: $('password').value
  });

  if (error) {
    status.textContent = 'Login failed: ' + error.message;
    return;
  }

  status.textContent = 'Login successful. Checking session...';
  console.log('Login returned session:', !!data.session);

  await refresh();
};
$('logout').onclick=async()=>{await sb.auth.signOut();status.textContent='Signed out.';await refresh();};
$('refresh').onclick=refresh;
$('reply-form').onsubmit=async e=>{e.preventDefault();const s=await session();if(!s||!activeConversation)return;const r=await fetch('/api/admin/reply',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+s.access_token},body:JSON.stringify({conversationId:activeConversation,message:$('reply-text').value})});const d=await r.json();if(!r.ok){status.textContent=d.error||'Reply failed.';return;}$('reply-text').value='';await loadThread();status.textContent='Reply saved. The customer can see it in the chat widget.';};
await refresh();setInterval(()=>{if(activeConversation)loadThread().catch(()=>{});},15000);
})();
</script></body></html>
