<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#075b4b">
  <title>Your Cart | Portexa</title>
  <link rel="stylesheet" href="/assets/site.css">
</head>

<body>
  <div class="topline">
    Thoughtfully made everyday care · Delivery available across Nigeria
  </div>

  <script src="/assets/header.js" data-part="header"></script>

  <main class="page-wrap">
    <div class="page-intro">
      <div class="eyebrow">Your selection</div>
      <h1>Your cart</h1>
      <p>Review your products and quantities before checkout.</p>
    </div>

    <section class="form-card">
      <div id="cart-list" class="cart-list">
        <p>Loading your cart…</p>
      </div>

      <div id="cart-total" class="cart-summary"></div>

      <div class="page-actions">
        <a class="button secondary" href="/shop.html">
          Continue shopping
        </a>

        <a class="button" id="checkout-link" href="/checkout.html">
          Continue to checkout
        </a>

        <button
          class="button secondary"
          id="whatsapp-order"
          type="button"
        >
          Send order by WhatsApp
        </button>
      </div>
    </section>
  </main>

  <script src="/assets/header.js" data-part="footer"></script>

  <script src="/assets/cart.js"></script>

  <script>
    (function () {
      const list = document.getElementById('cart-list');
      const totalBox = document.getElementById('cart-total');
      const checkoutLink = document.getElementById('checkout-link');
      const whatsappButton = document.getElementById('whatsapp-order');

      document.querySelectorAll('[data-year]').forEach(function (el) {
        el.textContent = new Date().getFullYear();
      });

      function money(amount) {
        return '₦' + amount.toLocaleString('en-NG');
      }

      function makeButton(text, label, onClick) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'button secondary';
        button.textContent = text;
        button.setAttribute('aria-label', label);
        button.addEventListener('click', onClick);
        return button;
      }

      function renderCart() {
        if (!window.portexaCart || !window.PORTEXA_PRODUCTS) {
          list.textContent =
            'The cart could not load. Please refresh the page.';
          checkoutLink.style.display = 'none';
          whatsappButton.style.display = 'none';
          return;
        }

        const cart = window.portexaCart.get();
        const products = window.PORTEXA_PRODUCTS;

        list.replaceChildren();
        totalBox.replaceChildren();

        let total = 0;
        let itemCount = 0;

        Object.keys(cart).forEach(function (id) {
          const product = products[id];
          const quantity = Number(cart[id]);

          if (!product || !Number.isFinite(quantity) || quantity <= 0) {
            return;
          }

          itemCount += quantity;
          total += product.price * quantity;

          const row = document.createElement('div');
          row.className = 'cart-row';

          const main = document.createElement('div');
          main.className = 'cart-row-main';

          const image = document.createElement('img');
          image.src = product.image;
          image.alt = product.alt;
          image.style.cssText =
            'width:90px;height:90px;object-fit:contain';

          image.onerror = function () {
            image.style.visibility = 'hidden';
          };

          const info = document.createElement('div');

          const name = document.createElement('strong');
          name.textContent = product.name;

          const detail = document.createElement('p');
          detail.className = 'quote-note';
          detail.textContent = product.detail;

          const lineTotal = document.createElement('strong');
          lineTotal.textContent = money(product.price * quantity);

          info.append(name, detail, lineTotal);
          main.append(image, info);

          const controls = document.createElement('div');
          controls.className = 'qty-controls';

          const decrease = makeButton('−', 'Decrease quantity', function () {
            window.portexaCart.change(id, -1);
            renderCart();
          });

          const qty = document.createElement('strong');
          qty.textContent = String(quantity);

          const increase = makeButton('+', 'Increase quantity', function () {
            window.portexaCart.change(id, 1);
            renderCart();
          });

          controls.append(decrease, qty, increase);
          row.append(main, controls);
          list.appendChild(row);
        });

        document.querySelectorAll('[data-cart-count]').forEach(function (el) {
          el.textContent = String(itemCount);
        });

        if (itemCount === 0) {
          list.textContent = 'Your cart is empty. Visit the shop to add products.';
          checkoutLink.style.display = 'none';
          whatsappButton.style.display = 'none';
          return;
        }

        checkoutLink.style.display = 'inline-flex';
        whatsappButton.style.display = 'inline-flex';

        const subtotal = document.createElement('strong');
        subtotal.textContent = 'Subtotal: ' + money(total);

        const note = document.createElement('p');
        note.className = 'quote-note';
        note.textContent =
          'Delivery charges are calculated separately and confirmed before fulfilment.';

        totalBox.append(subtotal, note);
      }

      whatsappButton.addEventListener('click', function () {
        const cart = window.portexaCart.get();
        const products = window.PORTEXA_PRODUCTS;
        const lines = [
          'Hello Portexa, I would like to place this order:',
          ''
        ];

        let total = 0;

        Object.keys(cart).forEach(function (id) {
          const product = products[id];
          const quantity = Number(cart[id]);

          if (!product || quantity <= 0) return;

          const subtotal = product.price * quantity;
          total += subtotal;

          lines.push(
            product.name,
            product.detail,
            'Quantity: ' + quantity,
            'Unit price: ' + money(product.price),
            'Subtotal: ' + money(subtotal),
            ''
          );
        });

        if (total === 0) {
          alert('Your cart is empty.');
          return;
        }

        lines.push(
          'Order subtotal: ' + money(total),
          '',
          'Please confirm delivery charges and the next steps.'
        );

        const url =
          'https://wa.me/2349138176684?text=' +
          encodeURIComponent(lines.join('\n'));

        window.open(url, '_blank', 'noopener,noreferrer');
      });

      renderCart();
    })();
  </script>

  <script src="/assets/chat.js"></script>
</body>
</html>
