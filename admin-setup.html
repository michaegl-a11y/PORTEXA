<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portexa | First Admin Setup</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui,sans-serif;background:#f6f7f4;color:#183e35;margin:0;padding:24px}.wrap{max-width:620px;margin:auto}.card{background:white;padding:22px;border-radius:16px;box-shadow:0 4px 20px #0001}input,button{font:inherit;padding:12px;border-radius:8px;margin:6px 0;width:100%;box-sizing:border-box}input{border:1px solid #ccd6d0}button{background:#17483b;color:white;border:0;cursor:pointer}#status{overflow-wrap:anywhere}</style></head><body><main class="wrap"><h1>Portexa first admin setup</h1><div class="card"><p>Use this page only during setup. Sign in with the account you want to make the administrator, then enter the temporary setup token you added in Vercel.</p><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button id="login">Sign in</button><hr><label>Temporary admin setup token<input id="setup-token" type="password" autocomplete="off" required></label><button id="make-admin">Assign administrator role</button><p id="status" role="status"></p><p>After success, remove <code>ADMIN_SETUP_TOKEN</code> from Vercel and redeploy. Then use <a href="/admin.html">the admin dashboard</a>.</p></div></main><script>
(async()=>{const $=id=>document.getElementById(id);let sb;let accessToken='';
try{const c=await fetch('/api/config').then(r=>r.json());if(!c.supabaseUrl||!c.supabaseAnonKey){$('status').textContent='Supabase is not configured.';return;}sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);}catch(e){$('status').textContent='Could not load configuration.';return;}
$('login').onclick=async()=>{const {data,error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){$('status').textContent=error.message;return;}accessToken=data.session.access_token;$('status').textContent='Signed in. Now enter the temporary setup token and assign the admin role.';};
$('make-admin').onclick=async()=>{if(!accessToken){$('status').textContent='Sign in first.';return;}const token=$('setup-token').value;if(!token){$('status').textContent='Enter the temporary setup token.';return;}const r=await fetch('/api/admin/bootstrap',{method:'POST',headers:{Authorization:'Bearer '+accessToken,'x-admin-setup-token':token}});const d=await r.json();$('status').textContent=d.message||d.error||'Request completed.';if(r.ok){$('setup-token').value='';}};
})();
</script></body></html>
